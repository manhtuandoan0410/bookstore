<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head>
        <title>Spring Security Example </title>
        <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{css/bootstrap.min.css}" />
    </head>
    <body>
     <div class="col-md-4 col-md-offset-4">
        <div class="alert alert-danger" th:if="${param.error}">
            username has already existed.
        </div>
        
        <form th:action="@{/signup}" method="post" class="d-flex flex-column gap-3">
            <div><label> Username : <input type="text" name="username" class="form-control" required/> </label></div>
            <div><label> Password: <input type="password" name="password" class="form-control" required/> </label></div>
            <div><label> Email: <input type="email" name="email" class="form-control" required/> </label></div>
            <div><input type="submit" value="Sign up" class="btn btn-primary"/></div>
        </form>

       </div>
    </body>
</html>
