spring.application.name=bookstore
spring.jpa.show-sql=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tuand?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=tuand
spring.datasource.password=password
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create
# pilvessä käytetty portti
server.port=7015
spring.data.rest.base-path=/api

# errorpage
# spring.web.error.whitelabel.enabled =false

# Set SSL_ENABLED=true, SSL_KEYSTORE_PATH, and SERVER_SSL_KEY_STORE_PASSWORD for HTTPS.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat
#server.ssl.key-store=/etc/ssl/private/springboot-example.p12
server.ssl.key-store=${SSL_KEYSTORE_PATH:springboot-example.p12}
server.ssl.key-store-password=changeit